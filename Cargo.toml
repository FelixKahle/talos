# Talos is a local-search solver for the dynamic berth allocation problem. The crates form a stack:
# `talos_core` holds the shared foundations (typed ids, intervals, the numeric trait);
# `talos_model` describes a problem instance on top of it; `talos_ls` is the local-search engine over the
# model; `talos_cmd` is the command-line binary and `pytalos` the Python bindings, both on top of the engine.

[workspace]
members = [
    "crates/talos_core",
    "crates/talos_model",
    "crates/talos_ls",
    "crates/pytalos",
    "crates/talos_cmd",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
authors = ["Felix Kahle"]
publish = false

[workspace.dependencies]
# The workspace's own crates, each named once here so members refer to them alike.
talos_core = { path = "crates/talos_core" }
talos_model = { path = "crates/talos_model" }
talos_ls = { path = "crates/talos_ls" }

# Traits for code generic over the integer types the solver accepts.
num-traits = { version = "0.2.19", default-features = false, features = ["std"] }
# Iterator adaptors std lacks; the bindings use them to reshape tables.
itertools = { version = "0.14.0", default-features = false, features = ["use_std"] }
# Randomness of the engine: seeded generators, and the thread generator for the unseeded tie-break.
rand = { version = "0.10.0", default-features = false, features = ["std", "std_rng", "thread_rng"] }
# Python bindings; `abi3-py38` builds one module for every CPython from 3.8 on.
pyo3 = { version = "0.28.2", features = ["abi3-py38"] }
# Reading and writing the binary's results as JSON.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }

# Benchmarks of the engine (dev-dependency only).
criterion = "0.8.2"
# Property tests (dev-dependency only); `std` is all the runner needs, without forking or timeouts.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"

# Own code stays debuggable in dev builds while dependencies are optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

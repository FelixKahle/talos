[package]
name = "talos_cmd"
version = "0.1.0"
edition.workspace = true

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
talos_core = { path = "../talos-core" }
talos_model = { path = "../talos-model" }
talos_ls = { path = "../talos-ls" }
talos_search = { path = "../talos-search" }
talos_solver = { path = "../talos-solver" }
num-traits = "0.2.19"
regex = "1.12.3"
rand = "0.10.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"
